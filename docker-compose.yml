version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: audioai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/audioai
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "4000:4000"
  worker:
    build:
      context: ./apps/worker
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
    depends_on:
      - redis
      - minio
  web:
    build:
      context: ./apps/web
    environment:
      API_BASE_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "3000:3000"
volumes:
  pgdata:
  redisdata:
  miniodata:
